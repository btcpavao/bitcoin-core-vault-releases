# Core Vault - Calamares 3.3.14 integration candidate
modules-search: [ local, /usr/lib/core-offline-installer/modules ]
branding: core-offline
prompt-install: true
dont-chroot: false
oem-setup: false
disable-cancel: false
disable-cancel-during-exec: true
hide-back-and-next-during-exec: true
quit-at-end: false
instances:
  - id: target
    module: coreoffline
    config: coreoffline-target.conf
  - id: verify
    module: coreoffline
    config: coreoffline-verify.conf
sequence:
  - show:
      - keyboard
      - partition
      - summary
  - exec:
      - partition
      - mount
      - unpackfs
      - machineid
      - keyboard
      - fstab
      - coreoffline@target
      - initramfs
      - bootloader
      - coreoffline@verify
      - umount
  - show:
      - finished
