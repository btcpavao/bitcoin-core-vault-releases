[LightDM]
minimum-vt=1
sessions-directory=/usr/share/xsessions

[Seat:*]
autologin-user=vault
autologin-user-timeout=0
autologin-session=core-vault
user-session=core-vault
greeter-session=lightdm-gtk-greeter
display-setup-script=/usr/share/core-signer/lightdm-display-setup.sh
xserver-command=X -background none
