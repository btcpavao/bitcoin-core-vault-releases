# UI additionally restricted by the version-bounded Core Vault source patch.
efi:
  mountPoint: /boot/efi
  recommendedSize: 512MiB
  minimumSize: 512MiB
  label: EFI
userSwapChoices: [none]
initialSwapChoice: none
initialPartitioningChoice: none
allowManualPartitioning: false
defaultFileSystemType: ext4
availableFileSystemTypes: [ext4]
enableLuksAutomatedPartitioning: false
lvm:
  enable: false
requiredStorage: 16.0
partitionLayout:
  - name: core-vault
    filesystem: ext4
    mountPoint: /
    size: 100%
    minSize: 12G
# Let upstream select GPT in UEFI mode and msdos in legacy BIOS mode.
