# Bitcoin Core Vault: local printing only.
LogLevel warn
MaxLogSize 0
Listen localhost:631
Listen /run/cups/cups.sock
Browsing No
DefaultShared No
WebInterface No
DefaultAuthType Basic

<Location />
  Order allow,deny
  Allow localhost
</Location>

<Location /admin>
  AuthType Default
  Require user @SYSTEM
  Order allow,deny
  Allow localhost
</Location>

<Location /admin/conf>
  AuthType Default
  Require user @SYSTEM
  Order allow,deny
  Allow localhost
</Location>
