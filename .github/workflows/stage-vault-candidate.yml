name: Stage a verified Vault rebuild candidate
on:
  push:
    branches: ['build/stage-vault-rebuild-*']
permissions: {}
jobs:
  stage:
    if: github.repository == 'btcpavao/bitcoin-core-vault-releases' && github.actor == 'btcpavao'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: read
    steps:
      - name: Validate source and proof of the selected run
        id: input
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          run=${GITHUB_REF_NAME##*-}
          [[ $run =~ ^[0-9]+$ ]]
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run" > "$RUNNER_TEMP/run.json"
          jq -e --arg repo "$GITHUB_REPOSITORY" '
            .status == "completed" and .conclusion == "success" and
            .path == ".github/workflows/vault-rebuild.yml" and
            .head_repository.full_name == $repo and
            (.head_branch == "build/reproducible-vault" or .head_branch == "main")' "$RUNNER_TEMP/run.json"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run/jobs?per_page=100" > "$RUNNER_TEMP/jobs.json"
          jq -e '[.jobs[] | select(.conclusion == "success") | .name] | sort == ["build (first)","build (second)","compare"]' "$RUNNER_TEMP/jobs.json"
          revision=$(jq -r .head_sha "$RUNNER_TEMP/run.json")
          [[ $revision =~ ^[0-9a-f]{40}$ ]]
          echo "revision=$revision" >> "$GITHUB_OUTPUT"
          echo "run=$run" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ steps.input.outputs.revision }}
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          run-id: ${{ steps.input.outputs.run }}
          github-token: ${{ github.token }}
          pattern: vault-*-${{ steps.input.outputs.revision }}
          path: ${{ runner.temp }}/rebuild
      - name: Compare complete ISOs again and prepare release assets
        env:
          REVISION: ${{ steps.input.outputs.revision }}
          RUN: ${{ steps.input.outputs.run }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          output="$RUNNER_TEMP/candidate"
          mkdir "$output"
          first="$RUNNER_TEMP/rebuild/vault-first-$REVISION"
          second="$RUNNER_TEMP/rebuild/vault-second-$REVISION"
          [[ $(git rev-parse HEAD) == "$REVISION" ]]
          for dir in "$first" "$second"; do
            grep -Fx "source_commit=$REVISION" "$dir/build-inputs.txt"
            (cd "$dir" && sha256sum --check SHA256SUMS)
          done
          cmp "$first/bitcoin-core-vault-amd64.iso" "$second/bitcoin-core-vault-amd64.iso"
          cmp "$first/build-inputs.txt" "$second/build-inputs.txt"
          cmp "$first/image-packages.tsv" "$second/image-packages.tsv"
          cmp "$first/builder-packages.tsv" "$second/builder-packages.tsv"
          cp "$first/bitcoin-core-vault-amd64.iso" "$output/bitcoin-core-vault-rebuild-${REVISION:0:12}-amd64.iso"
          cp "$first"/{build-inputs.txt,builder-packages.tsv,image-packages.tsv,vault-backup-package.sha256} "$output/"
          for side in first second; do
            gzip -n -c "$RUNNER_TEMP/rebuild/vault-$side-$REVISION/build.log" > "$output/build-$side.log.gz"
          done
          git -c tar.umask=0022 archive --format=tar --prefix=vault-source/ "$REVISION" |
            gzip -n > "$output/bitcoin-core-vault-source-${REVISION:0:12}.tar.gz"
          companion=bitcoin-core-vault-v0.4.0-calamares-source.tar.xz
          gh release download v0.5.0 --repo "$GITHUB_REPOSITORY" -p "$companion" --dir "$output"
          (cd "$output" && echo "62faea95f14b7d4314931d434fb647ee51e9430d7b83154681615487dddf8e6d  $companion" | sha256sum --check)
          jq -n --arg commit "$REVISION" --arg run "https://github.com/$GITHUB_REPOSITORY/actions/runs/$RUN" \
            --arg sha "$(sha256sum "$first/bitcoin-core-vault-amd64.iso" | cut -d' ' -f1)" \
            --argjson bytes "$(stat -c %s "$first/bitcoin-core-vault-amd64.iso")" \
            '{source_commit:$commit,workflow:$run,sha256:$sha,bytes:$bytes,full_iso_cmp:"match",builders:"two separate GitHub-hosted runners",release_status:"unsigned test candidate"}' > "$output/BUILD-PROOF.json"
          (cd "$output" && sha256sum -- * > SHA256SUMS && sha256sum --check SHA256SUMS)
      - name: Create a new candidate prerelease without modifying stable
        env:
          GH_TOKEN: ${{ github.token }}
          REVISION: ${{ steps.input.outputs.revision }}
          RUN: ${{ steps.input.outputs.run }}
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/candidate"
          tag="rebuild-candidate-${REVISION:0:12}"
          # Existing public releases are never overwritten. A failed draft can
          # be inspected without making a partial download available.
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Review the existing release/draft for $tag." >&2; exit 1
          fi
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" > "$RUNNER_TEMP/tag.json" 2>/dev/null; then
            jq -e --arg sha "$REVISION" '.object.type == "commit" and .object.sha == $sha' "$RUNNER_TEMP/tag.json"
          else
            gh api -X POST "repos/$GITHUB_REPOSITORY/git/refs" -f "ref=refs/tags/$tag" -f "sha=$REVISION"
          fi
          cat > "$RUNNER_TEMP/notes.md" <<NOTES
          Test candidate for independent rebuilding. Two separate GitHub-hosted runners built the same complete ISO and compared every byte. The original v0.5.0 ISO remains the stable download. This candidate is unsigned; native boot, installation and wallet/recovery acceptance apply to each exact candidate separately.

          ISO SHA-256: $(jq -r .sha256 BUILD-PROOF.json)  
          Exact source: $REVISION  
          Build and comparison: https://github.com/$GITHUB_REPOSITORY/actions/runs/$RUN

          [Build and verify](https://github.com/$GITHUB_REPOSITORY/blob/$REVISION/docs/REBUILD.md) · [Hrvatske upute](https://github.com/$GITHUB_REPOSITORY/blob/$REVISION/docs/REBUILD.hr.md).

          Assets include the ISO, Git source snapshot, Calamares source companion, both build logs, package/version records, checksum manifest and build proof. Vault Backup was rebuilt from its source and compared byte for byte with the packaged copy. The whole-ISO build uses recorded binary inputs for upstream software and the C++ applications. Matching images establish reproducibility for these inputs; independent inspection of their source remains valuable.
          NOTES
          gh release create "$tag" --repo "$GITHUB_REPOSITORY" --verify-tag --draft --prerelease \
            --title "Vault rebuild candidate ${REVISION:0:12} (unsigned)" --notes-file "$RUNNER_TEMP/notes.md" ./*
          gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" |
            jq -e --arg tag "$tag" '[.[] | select(.tag_name == $tag)] | select(length == 1) | .[0]' > "$RUNNER_TEMP/draft.json"
          python3 - "$RUNNER_TEMP/draft.json" <<'PY'
          import hashlib,json,pathlib,sys
          draft=json.loads(pathlib.Path(sys.argv[1]).read_text())
          assert draft['draft'] and draft['prerelease']
          assets={a['name']:a for a in draft['assets']}
          paths=list(pathlib.Path('.').iterdir())
          assert len(paths)==len(assets)
          for path in paths:
              asset=assets[path.name]
              assert asset['size']==path.stat().st_size
              with path.open('rb') as stream:
                  assert asset['digest']=='sha256:'+hashlib.file_digest(stream,'sha256').hexdigest()
          PY
          gh release edit "$tag" --repo "$GITHUB_REPOSITORY" --draft=false --prerelease --latest=false
