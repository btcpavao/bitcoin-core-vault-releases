name: Rebuild Vault with native sources and test UEFI installation
on:
  push:
    branches: [main]
    tags: ['v*']
    paths-ignore: ['README.md', 'docs/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vault-rebuild-${{ github.sha }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        builder: [first, second]
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Build in a fresh container
        run: bash tools/rebuild/build.sh "$RUNNER_TEMP/vault-result"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: vault-${{ matrix.builder }}-${{ github.sha }}
          path: ${{ runner.temp }}/vault-result/
          compression-level: 0
          retention-days: 3
          if-no-files-found: error

  compare:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: vault-*-${{ github.sha }}
          path: results
      - name: Check both full images
        env:
          REVISION: ${{ github.sha }}
        run: |
          set -euo pipefail
          a="results/vault-first-$REVISION"
          b="results/vault-second-$REVISION"
          for dir in "$a" "$b"; do
            (cd "$dir" && sha256sum --check SHA256SUMS)
            grep -Fx "source_commit=$REVISION" "$dir/build-inputs.txt"
            cat "$dir/SHA256SUMS"
          done
          cmp "$a/bitcoin-core-vault-amd64.iso" "$b/bitcoin-core-vault-amd64.iso"
          printf 'Both complete ISO files match for commit %s\n' "$REVISION" >> "$GITHUB_STEP_SUMMARY"
          cat "$a/SHA256SUMS" >> "$GITHUB_STEP_SUMMARY"
      - name: Identify differences for an unsuccessful comparison
        if: failure()
        env:
          REVISION: ${{ github.sha }}
        run: |
          set -euo pipefail
          sudo apt-get -qq update
          sudo apt-get -qy install --no-install-recommends xorriso squashfs-tools
          for side in first second; do
            image="results/vault-$side-$REVISION/bitcoin-core-vault-amd64.iso"
            xorriso -osirrox on -indev "$image" -extract / "$RUNNER_TEMP/$side-iso"
            sudo unsquashfs -no-progress -user-xattrs -d "$RUNNER_TEMP/$side-root" \
              "$RUNNER_TEMP/$side-iso/live/filesystem.squashfs"
          done
          sudo diff -qr --no-dereference "$RUNNER_TEMP/first-iso" "$RUNNER_TEMP/second-iso" > iso-differences.txt || [[ $? == 1 ]]
          sudo diff -qr --no-dereference "$RUNNER_TEMP/first-root" "$RUNNER_TEMP/second-root" > file-differences.txt || [[ $? == 1 ]]
          head -100 iso-differences.txt file-differences.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: failure()
        with:
          name: vault-differences-${{ github.sha }}
          path: '*-differences.txt'
          if-no-files-found: ignore

  install:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: vault-first-${{ github.sha }}
          path: ${{ runner.temp }}/candidate
      - name: Install the exact candidate in an isolated UEFI virtual disk
        run: |
          set -euo pipefail
          sudo apt-get -qq update
          sudo apt-get install -y --no-install-recommends qemu-system-x86 qemu-utils ovmf mtools python3-pil tesseract-ocr tesseract-ocr-eng
          cd "$RUNNER_TEMP/candidate"
          sha256sum --check SHA256SUMS
          iso="$PWD/bitcoin-core-vault-amd64.iso"
          sha=$(sha256sum "$iso" | cut -d' ' -f1)
          curl --fail --silent --show-error --location --retry 3 \
            https://github.com/btcpavao/bitcoin-core-vault-releases/releases/download/v0.4.0/bitcoin-core-vault-v0.4.0-qa-evidence.tar.gz -o harness.tar.gz
          echo '6c0fb72d6a29a8cbf7fbeef3a6677e208df3d064bd470c793e27c1b2d2e6071e  harness.tar.gz' | sha256sum --check
          tar -xzf harness.tar.gz bitcoin-core-vault-v0.4.0-qa/qa-adapted/tools/core-vault
          harness="$PWD/bitcoin-core-vault-v0.4.0-qa/qa-adapted/tools/core-vault/ci-vm-acceptance.py"
          export OMP_THREAD_LIMIT=1 OMP_NUM_THREADS=1
          runner=(env)
          accel=tcg
          if [[ -c /dev/kvm ]]; then
            # KVM's device node may be recreated after the last guest exits.
            # Keep access group-scoped across all three fresh VM processes.
            getent group kvm
            echo 'KERNEL=="kvm", GROUP:="kvm", MODE:="0660"' | sudo tee /etc/udev/rules.d/99-vault-ci-kvm.rules
            sudo udevadm control --reload-rules
            sudo udevadm trigger --name-match=kvm
            sudo udevadm settle
            sudo chgrp kvm /dev/kvm
            sudo chmod 0660 /dev/kvm
            runner=(sudo runuser -u "$(id -un)" -g kvm -- env OMP_THREAD_LIMIT=1 OMP_NUM_THREADS=1)
            "${runner[@]}" test -w /dev/kvm
            accel=kvm
          fi
          echo "UEFI acceptance accelerator: $accel"
          "${runner[@]}" /usr/bin/python3 "$harness" --iso "$iso" --sha256 "$sha" \
            --firmware uefi --accel "$accel" --install --output "$RUNNER_TEMP/uefi"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: vault-uefi-${{ github.sha }}
          path: |
            ${{ runner.temp }}/uefi/**/*.json
            ${{ runner.temp }}/uefi/**/*.log
            ${{ runner.temp }}/uefi/**/*.png
          retention-days: 7
          if-no-files-found: warn
