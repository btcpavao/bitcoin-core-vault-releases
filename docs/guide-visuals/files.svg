<svg xmlns="http://www.w3.org/2000/svg" width="922" height="415" viewBox="0 0 922 415"><rect x="1" y="1" width="448" height="142" rx="10" fill="#142431" stroke="#8ecbff" stroke-width="1.5"/><text x="17" y="35.5625" fill="#8ecbff" font-family="DejaVu Sans" font-size="20" font-weight="700">RAM • Private session</text><text x="17" y="68.7031" fill="#c4c4c4" font-family="DejaVu Sans" font-size="18" font-weight="400">Core wallets</text><text x="17" y="93.7031" fill="#c4c4c4" font-family="DejaVu Sans" font-size="18" font-weight="400">Decrypted files</text><text x="17" y="118.703" fill="#c4c4c4" font-family="DejaVu Sans" font-size="18" font-weight="400">Working notes and PSBTs</text><rect x="473" y="1" width="448" height="142" rx="10" fill="#2a2117" stroke="#ffc47e" stroke-width="1.5"/><text x="489" y="35.5625" fill="#ffc47e" font-family="DejaVu Sans" font-size="20" font-weight="700">External media</text><text x="489" y="68.7031" fill="#c4c4c4" font-family="DejaVu Sans" font-size="18" font-weight="400">Verified encrypted backups</text><text x="489" y="93.7031" fill="#c4c4c4" font-family="DejaVu Sans" font-size="18" font-weight="400">Exported signed PSBTs</text><text x="489" y="118.703" fill="#c4c4c4" font-family="DejaVu Sans" font-size="18" font-weight="400">Deliberately saved documents</text><path d="M 35 185 L 887 185" fill="none" stroke="#c4c4c4" stroke-width="2"/><polyline points="880,180 887,185 880,190" fill="none" stroke="#c4c4c4" stroke-width="2"/><text x="0" y="223.562" fill="#f2f2f2" font-family="DejaVu Sans" font-size="20" font-weight="700">Export the files you need to keep</text><rect x="1" y="250" width="448" height="92" rx="10" fill="#142431" stroke="#8ecbff" stroke-width="1.5"/><text x="17" y="284.562" fill="#8ecbff" font-family="DejaVu Sans" font-size="20" font-weight="700">Session ends</text><text x="17" y="317.703" fill="#c4c4c4" font-family="DejaVu Sans" font-size="18" font-weight="400">Private RAM files disappear.</text><rect x="473" y="250" width="448"