<svg xmlns="http://www.w3.org/2000/svg" width="922" height="415" viewBox="0 0 922 415"><text x="0" y="19.5625" fill="#8ecbff" font-family="DejaVu Sans" font-size="20" font-weight="700">ONLINE</text><text x="487" y="19.5625" fill="#ffc47e" font-family="DejaVu Sans" font-size="20" font-weight="700">OFFLINE VAULT</text><rect x="1" y="43" width="433" height="117" rx="10" fill="#142431" stroke="#8ecbff" stroke-width="1.5"/><text x="17" y="77.5625" fill="#8ecbff" font-family="DejaVu Sans" font-size="20" font-weight="700">1 Prepare</text><text x="17" y="110.703" fill="#c4c4c4" font-family="DejaVu Sans" font-size="18" font-weight="400">Create an unsigned PSBT.</text><rect x="488" y="43" width="433" height="117" rx="10" fill="#2a2117" stroke="#ffc47e" stroke-width="1.5"/><text x="504" y="77.5625" fill="#ffc47e" font-family="DejaVu Sans" font-size="20" font-weight="700">2 Review</text><text x="504" y="110.703" fill="#c4c4c4" font-family="DejaVu Sans" font-size="18" font-weight="400">Check destination, amount and transaction</text><text x="504" y="135.703" fill="#c4c4c4" font-family="DejaVu Sans" font-size="18" font-weight="400">details.</text><path d="M 442 101.5 L 480 101.5" fill="none" stroke="#c4c4c4" stroke-width="2"/><polyline points="473,96.5 480,101.5 473,106.5" fill="none" stroke="#c4c4c4" stroke-width="2"/><text x="0" y="194.703" fill="#c4c4c4" font-family="DejaVu Sans" font-size="18" font-weight="400">PSBT files cross by removable media</text><path d="M 704.5 167 L 704.5 216" fill="none" stroke="#c4c4c4" stroke-width="2"/><polyline points="699.5,209 704.5,216 709.5,209" fill="none" stroke="#c4c4c4" stroke-width="2"/><rect x="1" y="223" width="433" height="117" rx="10" fill="#142431" stroke="#8ecbff" stroke-width="1.5"/><text x="17" y="257.562" fill="#8ecbff" font-family="DejaVu Sans" font-size="20" font-weight="700">4 Broadcast</text><text x="17" y="290.703" fill="#c4c4c4" font-family="DejaVu Sans" font-size="18" font-weight="400">Publish the signed transaction from the</text><text x="17" y="315.703" fill="#c4c4c4" font-family="DejaVu Sans" font-size="18" font-weight="400">online coordinator.</text><rect x="488" y="223" width="433" height="117" rx="10" fill="#2a2117" stroke="#ffc47e" stroke-width="1.5"/><text x="504" y="257.562" fill="#ffc47e" font-family="DejaVu Sans" font-size="20" font-weight="700">3 Sign</text><text x="504" y="290.703" fill="#c4c4c4" font-family="DejaVu Sans" font-size="18" font-weight="400">Sign in Core, then export the signed PSBT.</text><path d="M 480 281.5 L 442 281.5" fill="none" stroke="#c4c4c4" stroke-width="2"/><polyline points="449,276.5 442,281.5 449,286.5" fill="none" stroke="#c4c4c4" stroke-width="2"/><path d="M 1 362 H 921" stroke="#4a4a4a" stroke-width="1"/><text x="0" y="396.703" fill="#a5dfb0" font-family="DejaVu Sans" font-size="18" font-weight="700">The PSBT transfer does not contain private keys.</text></svg>