<svg xmlns="http://www.w3.org/2000/svg" width="922" height="340" viewBox="0 0 922 340"><rect x="1" y="1" width="448" height="117" rx="10" fill="#2a2117" stroke="#ffc47e" stroke-width="1.5"/><text x="17" y="35.5625" fill="#ffc47e" font-family="DejaVu Sans" font-size="20" font-weight="700">1 WRITE</text><text x="17" y="68.7031" fill="#c4c4c4" font-family="DejaVu Sans" font-size="18" font-weight="400">Burn the encrypted backup to a compatible</text><text x="17" y="93.7031" fill="#c4c4c4" font-family="DejaVu Sans" font-size="18" font-weight="400">disc.</text><rect x="473" y="1" width="448" height="117" rx="10" fill="#17271d" stroke="#a5dfb0" stroke-width="1.5"/><text x="489" y="35.5625" fill="#a5dfb0" font-family="DejaVu Sans" font-size="20" font-weight="700">2 READ BACK</text><text x="489" y="68.7031" fill="#c4c4c4" font-family="DejaVu Sans" font-size="18" font-weight="400">Read the actual disc and verify the copied</text><text x="489" y="93.7031" fill="#c4c4c4" font-family="DejaVu Sans" font-size="18" font-weight="400">data.</text><rect x="1" y="150" width="448" height="117" rx="10" fill="#142431" stroke="#8ecbff" stroke-width="1.5"/><text x="17" y="184.562" fill="#8ecbff" font-family="DejaVu Sans" font-size="20" font-weight="700">3 STORE • Location A</text><text x="17" y="217.703" fill="#c4c4c4" font-family="DejaVu Sans" font-size="18" font-weight="400">Label and keep the first verified disc.</text><rect x="473" y="150" width="448" height="117" rx="10" fill="#142431" stroke="#8ecbff" stroke-width="1.5"/><text x="489" y="184.562" fill="#8ecbff" font-family="DejaVu Sans" font-size="20" font-weight="700">3 STORE • Location B</text><text x="489" y="217.703" fill="#c4c4c4" font-family="DejaVu Sans" font-size="18" font-weight="400">Keep an independent verified copy</text><text x="489" y="242.703" fill="#c4c4c4" font-family="DejaVu Sans" font-size="18" font-weight="400">elsewhere.</text><path d="M 1 287 H 921" stroke="#4a4a4a" stroke-width="1"/><text x="0" y="321.703" fill="#8ecbff" font-family="DejaVu Sans" font-size="18" font-weight="700">A successful write is followed by verification and recovery drills.</text></svg>