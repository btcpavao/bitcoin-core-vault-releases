<svg xmlns="http://www.w3.org/2000/svg" width="922" height="347" viewBox="0 0 922 347"><rect x="1" y="1" width="920" height="92" rx="10" fill="#2a2117" stroke="#ffc47e" stroke-width="1.5"/><text x="17" y="35.5625" fill="#ffc47e" font-family="DejaVu Sans" font-size="20" font-weight="700">GPG backup: protects the complete package</text><text x="17" y="68.7031" fill="#c4c4c4" font-family="DejaVu Sans" font-size="18" font-weight="400">Separate GPG passphrase(s)</text><text x="0" y="135.562" fill="#f2f2f2" font-family="DejaVu Sans" font-size="20" font-weight="700">Inside wallet.dat</text><rect x="1" y="157" width="448" height="117" rx="10" fill="#142431" stroke="#8ecbff" stroke-width="1.5"/><text x="17" y="191.562" fill="#8ecbff" font-family="DejaVu Sans" font-size="20" font-weight="700">Private-key material</text><text x="17" y="224.703" fill="#c4c4c4" font-family="DejaVu Sans" font-size="18" font-weight="400">Locked by the Core passphrase if wallet</text><text x="17" y="249.703" fill="#c4c4c4" font-family="DejaVu Sans" font-size="18" font-weight="400">encryption is enabled.</text><rect x="473" y="157" width="448" height="117" rx="10" fill="#202020" stroke="#666666" stroke-width="1.5"/><text x="489" y="191.562" fill="#f2f2f2" font-family="DejaVu Sans" font-size="20" font-weight="700">Public information</text><text x="489" y="224.703" fill="#c4c4c4" font-family="DejaVu Sans" font-size="18" font-weight="400">Addresses and other metadata may remain</text><text x="489" y="249.703" fill="#c4c4c4" font-family="DejaVu Sans" font-size="18" font-weight="400">readable.</text><path d="M 1 294 H 921" stroke="#4a4a4a" stroke-width="1"/><text x="0" y="328.703" fill="#8ecbff" font-family="DejaVu Sans" font-size="18" font-weight="700">Opening GPG reveals the file. Unlocking Core enables signing.</text></svg>