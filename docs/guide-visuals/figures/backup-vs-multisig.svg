<svg xmlns="http://www.w3.org/2000/svg" width="590" height="426" viewBox="0 0 590 426"><text x="0" y="19.5625" fill="#8ecbff" font-family="DejaVu Sans" font-size="20" font-weight="700">GPG backup layers</text><text x="309" y="19.5625" fill="#d0b3ff" font-family="DejaVu Sans" font-size="20" font-weight="700">Bitcoin multisig</text><rect x="1" y="51" width="86.3333" height="42" rx="8" fill="#142431" stroke="#8ecbff" stroke-width="1.5"/><text x="12" y="76.7031" fill="#8ecbff" font-family="DejaVu Sans" font-size="18" font-weight="700">A</text><rect x="97.3333" y="51" width="86.3333" height="42" rx="8" fill="#142431" stroke="#8ecbff" stroke-width="1.5"/><text x="108.333" y="76.7031" fill="#8ecbff" font-family="DejaVu Sans" font-size="18" font-weight="700">B</text><rect x="193.667" y="51" width="86.3333" height="42" rx="8" fill="#142431" stroke="#8ecbff" stroke-width="1.5"/><text x="204.667" y="76.7031" fill="#8ecbff" font-family="DejaVu Sans" font-size="18" font-weight="700">C</text><rect x="310" y="51" width="86.3333" height="42" rx="8" fill="#241c30" stroke="#d0b3ff" stroke-width="1.5"/><text x="321" y="76.7031" fill="#d0b3ff" font-family="DejaVu Sans" font-size="18" font-weight="700">K1</text><rect x="406.333" y="51" width="86.3333" height="42" rx="8" fill="#241c30" stroke="#d0b3ff" stroke-width="1.5"/><text x="417.333" y="76.7031" fill="#d0b3ff" font-family="DejaVu Sans" font-size="18" font-weight="700">K2</text><rect x="502.667" y="51" width="86.3333" height="42" rx="8" fill="#241c30" stroke="#d0b3ff" stroke-width="1.5"/><text x="513.667" y="76.7031" fill="#d0b3ff" font-family="DejaVu Sans" font-size="18" font-weight="700">K3</text><text x="0" y="129.703" fill="#8ecbff" font-family="DejaVu Sans" font-size="18" font-weight="700">ALL external secrets</text><path d="M 140.5 146 L 140.5 174" fill="none" stroke="#8ecbff" stroke-width="2"/><polyline points="135.5,167 140.5,174 145.5,167" fill="none" stroke="#8ecbff" stroke-width="2"/><text x="309" y="129.703" fill="#d0b3ff" font-family="DejaVu Sans" font-size="18" font-weight="700">Example: ANY 2 of 3 keys</text><path d="M 449.5 146 L 449.5 174" fill="none" stroke="#d0b3ff" stroke-width="2"/><polyline points="444.5,167 449.5,174 454.5,167" fill="none" stroke="#d0b3ff" stroke-width="2"/><rect x="1" y="186" width="279" height="142" rx="10" fill="#142431" stroke="#8ecbff" stroke-width="1.5"/><text x="17" y="220.562" fill="#8ecbff" font-family="DejaVu Sans" font-size="20" font-weight="700">Open the backup</text><text x="17" y="253.703" fill="#c4c4c4" font-family="DejaVu Sans" font-size="18" font-weight="400">Recover the wallet file. Its</text><text x="17" y="278.703" fill="#c4c4c4" font-family="DejaVu Sans" font-size="18" font-weight="400">Bitcoin signing rules stay</text><text x="17" y="303.703" fill="#c4c4c4" font-family="DejaVu Sans" font-size="18" font-weight="400">the same.</text><rect x="310" y="186" width="279" height="142" rx="10" fill="#241c30" stroke="#d0b3ff" stroke-width="1.5"/><text x="326" y="220.562" fill="#d0b3ff" font-family="DejaVu Sans" font-size="20" font-weight="700">Authorize spending</text><text x="326" y="253.703" fill="#c4c4c4" font-family="DejaVu Sans" font-size="18" font-weight="400">The Bitcoin script requires</text><text x="326" y="278.703" fill="#c4c4c4" font-family="DejaVu Sans" font-size="18" font-weight="400">the signing threshold for a</text><text x="326" y="303.703" fill="#c4c4c4" font-family="DejaVu Sans" font-size="18" font-weight="400">transaction.</text><path d="M 1 348 H 589" stroke="#4a4a4a" stroke-width="1"/><text x="0" y="382.703" fill="#c4c4c4" font-family="DejaVu Sans" font-size="18" font-weight="700">Different controls: access to a backup and authorization</text><text x="0" y="407.703" fill="#c4c4c4" font-family="DejaVu Sans" font-size="18" font-weight="700">to spend.</text></svg>