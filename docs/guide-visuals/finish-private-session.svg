<svg xmlns="http://www.w3.org/2000/svg" width="922" height="300" viewBox="0 0 922 300"><rect x="1" y="1" width="920" height="92" rx="10" fill="#142431" stroke="#8ecbff" stroke-width="1.5"/><text x="17" y="35.5625" fill="#8ecbff" font-family="DejaVu Sans" font-size="20" font-weight="700">1 Save what you need</text><text x="17" y="68.7031" fill="#c4c4c4" font-family="DejaVu Sans" font-size="18" font-weight="400">Export backups and keep required passphrases recoverable. Confirm you have saved them.</text><rect x="1" y="110" width="920" height="92" rx="10" fill="#2a2117" stroke="#ffc47e" stroke-width="1.5"/><text x="17" y="144.562" fill="#ffc47e" font-family="DejaVu Sans" font-size="20" font-weight="700">2 Confirm session data loss</text><text x="17" y="177.703" fill="#c4c4c4" font-family="DejaVu Sans" font-size="18" font-weight="400">Anything kept only in RAM will be lost. Start the five-minute countdown.</text><rect x="1" y="110" width="920" height="92" rx="10" fill="#142431" stroke="#8ecbff" stroke-width="1.5"/><text x="17" y="144.562" fill="#8ecbff" font-family="DejaVu Sans" font-size="20" font-weight="700">05:00 → 00:00</text><text x="17" y="177.703" fill="#c4c4c4" font-family="DejaVu Sans" font-size="18" font-weight="400">The session stays open. No passphrase entry or backup check.</text><rect x="1" y="110" width="448" height="117" rx="10" fill="#17271d" stroke="#a5dfb0" stroke-width="1.5"/><text x="17" y="144.562" fill="#a5dfb0" font-family="DejaVu Sans" font-size="20" font-weight="700">Cancel countdown</text><text x="17" y="177.703" fill="#c4c4c4" font-family="DejaVu Sans" font-size="18" font-weight="400">Keep working and save anything missing.</text><rect x="473" y="110" width="448" height="117" rx="10" fill="#2a2117" stroke="#ffc47e" stroke-width="1.5"/><text x="489" y="144.562" fill="#ffc47e" font-family="DejaVu Sans" font-size="20" font-weight="700">Timer ends / Finish now</text><text x="489" y="177.703" fill="#c4c4c4" font-family="DejaVu Sans" font-size="18" font-weight="400">Close Core, clear clipboard, end the RAM</text><text x="489" y="202.703" fill="#c4c4c4" font-family="DejaVu Sans" font-size="18" font-weight="400">session.</text><path d="M 1 247 H 921" stroke="#4a4a4a" stroke-width="1"/><text x="0" y="281.703" fill="#c4c4c4" font-family="DejaVu Sans" font-size="18" font-weight="700">External copies remain. Power loss can bypass these warnings.</text></svg>