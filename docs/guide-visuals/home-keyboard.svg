<svg xmlns="http://www.w3.org/2000/svg" width="922" height="399" viewBox="0 0 922 399"><rect x="1" y="1" width="150" height="54" rx="8" fill="#142431" stroke="#8ecbff" stroke-width="1.5"/><text x="15" y="32.6406" fill="#8ecbff" font-family="DejaVu Sans" font-size="19" font-weight="700">F12</text><text x="176" y="29.7031" fill="#f2f2f2" font-family="DejaVu Sans" font-size="18" font-weight="400">Show Home / return to applications</text><rect x="1" y="67" width="150" height="54" rx="8" fill="#142431" stroke="#8ecbff" stroke-width="1.5"/><text x="15" y="98.6406" fill="#8ecbff" font-family="DejaVu Sans" font-size="19" font-weight="700">Tab</text><text x="176" y="95.7031" fill="#f2f2f2" font-family="DejaVu Sans" font-size="18" font-weight="400">Move to the next control</text><rect x="1" y="133" width="150" height="54" rx="8" fill="#142431" stroke="#8ecbff" stroke-width="1.5"/><text x="15" y="164.641" fill="#8ecbff" font-family="DejaVu Sans" font-size="19" font-weight="700">Shift+Tab</text><text x="176" y="161.703" fill="#f2f2f2" font-family="DejaVu Sans" font-size="18" font-weight="400">Move to the previous control</text><rect x="1" y="199" width="150" height="54" rx="8" fill="#142431" stroke="#8ecbff" stroke-width="1.5"/><text x="15" y="230.641" fill="#8ecbff" font-family="DejaVu Sans" font-size="19" font-weight="700">Space</text><text x="176" y="227.703" fill="#f2f2f2" font-family="DejaVu Sans" font-size="18" font-weight="400">Activate the focused control</text><rect x="1" y="265" width="150" height="54" rx="8" fill="#142431" stroke="#8ecbff" stroke-width="1.5"/><text x="15" y="296.641" fill="#8ecbff" font-family="DejaVu Sans" font-size="19" font-weight="700">Enter</text><text x="176" y="293.703" fill="#f2f2f2" font-family="DejaVu Sans" font-size="18" font-weight="400">Choose No in the power confirmation</text><rect x="1" y="331" width="150" height="54" rx="8" fill="#142431" stroke="#8ecbff" stroke-width="1.5"/><text x="15" y="362.641" fill="#8ecbff" font-family="DejaVu